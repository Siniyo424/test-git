<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>素数判定</title>
</head>
<body>

<script>
    function primenumber(n) {
        let i = 2;

        while (i < n) {
            document.write(i + "," + n + "<br>");

            if (n % i != 0) {
                document.write("割り切れない<br>");
            } else {
                document.write("割り切れる<br>");
                break;
            }

            i++;
        }

        if (i == n) {
            document.write("素数!");
        } else {
            document.write("素数ではない!");
        }
    }

    primenumber(19);
</script>

</body>
</html>
